<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Destruction sandbox</title>

<!--
  No build step. Import maps resolve the bare specifiers used across src/,
  so this folder can be dropped straight onto GitHub Pages or any static host.
  For production, swap the CDN URLs for locally vendored copies and pin them.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>

<style>
  :root {
    --ink: #e6e9ea;
    --ink-dim: #8b9499;
    --rule: #2a3339;
    --alert: #e0603a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #10151a;
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
  }

  #viewport { display: block; width: 100%; height: 100%; cursor: crosshair; }

  /* Crosshair: two hairlines and a gap. A filled dot hides exactly the pixels
     you are trying to aim at. */
  .reticle {
    position: fixed;
    left: 50%; top: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    pointer-events: none;
    opacity: 0.75;
  }
  .reticle::before, .reticle::after {
    content: "";
    position: absolute;
    background: var(--ink);
  }
  .reticle::before { left: 50%; top: 0; width: 1px; height: 7px; margin-left: -0.5px; box-shadow: 0 15px 0 var(--ink); }
  .reticle::after  { top: 50%; left: 0; height: 1px; width: 7px; margin-top: -0.5px; box-shadow: 15px 0 0 var(--ink); }

  .telemetry {
    position: fixed;
    left: 18px; bottom: 16px;
    display: grid;
    grid-template-columns: auto auto;
    gap: 2px 14px;
    padding: 12px 16px 12px 0;
    font-size: 12.5px;
    line-height: 1.6;
    pointer-events: none;
  }
  .telemetry dt { color: var(--ink-dim); }
  .telemetry dd {
    margin: 0;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", ui-monospace, "Roboto Mono", monospace;
    text-align: right;
  }

  .controls {
    position: fixed;
    right: 18px; bottom: 16px;
    max-width: 240px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--ink-dim);
    text-align: right;
    pointer-events: none;
  }
  .controls b { color: var(--ink); font-weight: 500; }

  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 10px;
    background: #10151a;
    text-align: center;
    z-index: 10;
  }
  #boot h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  #boot p { margin: 0; color: var(--ink-dim); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div class="reticle" aria-hidden="true"></div>

  <dl class="telemetry">
    <dt>Frames per second</dt><dd id="stat-fps">—</dd>
    <dt>Live shards</dt><dd id="stat-shards">—</dd>
    <dt>Rigid bodies</dt><dd id="stat-bodies">—</dd>
    <dt>Tiles destroyed</dt><dd id="stat-tiles">—</dd>
  </dl>

  <p class="controls">
    Click to capture the mouse.<br />
    <b>WASD</b> move, <b>Space</b> / <b>C</b> rise and drop, <b>Shift</b> to sprint.<br />
    <b>Left click</b> fires the rifle, <b>right click</b> the breaching charge.
  </p>

  <div id="boot">
    <h1>Compiling fracture patterns</h1>
    <p>Rapier is loading and the shard geometry is being baked.</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>

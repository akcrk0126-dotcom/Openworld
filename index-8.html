<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Destruction sandbox</title>

<!--
  No build step. The import map resolves the bare "three" specifier used across
  src/. Rapier is NOT mapped here: it is loaded at runtime by PhysicsWorld.js
  with a fallback chain, because the compat package's ESM entry point has moved
  between releases and a wrong URL here is unrecoverable and silent.

  For production, vendor both locally and pin them.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>

<style>
  :root {
    --ink: #e6e9ea;
    --ink-dim: #8b9499;
    --alert: #e0603a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #10151a;
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
  }

  #viewport { display: block; width: 100%; height: 100%; cursor: crosshair; }

  /* Crosshair: two hairlines and a gap. A filled dot hides exactly the pixels
     you are trying to aim at. */
  .reticle {
    position: fixed;
    left: 50%; top: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    pointer-events: none;
    opacity: 0.75;
  }
  .reticle::before, .reticle::after {
    content: "";
    position: absolute;
    background: var(--ink);
  }
  .reticle::before { left: 50%; top: 0; width: 1px; height: 7px; margin-left: -0.5px; box-shadow: 0 15px 0 var(--ink); }
  .reticle::after  { top: 50%; left: 0; height: 1px; width: 7px; margin-top: -0.5px; box-shadow: 15px 0 0 var(--ink); }

  .telemetry {
    position: fixed;
    left: 18px; bottom: 16px;
    display: grid;
    grid-template-columns: auto auto;
    gap: 2px 14px;
    padding: 12px 16px 12px 0;
    font-size: 12.5px;
    line-height: 1.6;
    pointer-events: none;
  }
  .telemetry dt { color: var(--ink-dim); }
  .telemetry dd {
    margin: 0;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", ui-monospace, "Roboto Mono", monospace;
    text-align: right;
  }

  .controls {
    position: fixed;
    right: 18px; bottom: 16px;
    max-width: 240px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--ink-dim);
    text-align: right;
    pointer-events: none;
  }
  .controls b { color: var(--ink); font-weight: 500; }

  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 10px;
    padding: 32px;
    background: #10151a;
    text-align: center;
    z-index: 10;
  }
  #boot-title {
    margin: 0;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  #boot-stage {
    margin: 0;
    max-width: 52ch;
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.6;
  }
  #boot-detail {
    margin: 14px 0 0;
    max-width: 90ch;
    max-height: 42vh;
    overflow: auto;
    padding: 14px 16px;
    border-left: 2px solid var(--alert);
    background: #161c22;
    color: var(--ink);
    font-family: "SF Mono", ui-monospace, "Roboto Mono", monospace;
    font-size: 12px;
    line-height: 1.55;
    text-align: left;
    white-space: pre-wrap;
    user-select: text;
  }
  #boot.is-error #boot-title { color: var(--alert); }
</style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div class="reticle" aria-hidden="true"></div>

  <dl class="telemetry">
    <dt>Frames per second</dt><dd id="stat-fps">—</dd>
    <dt>Live shards</dt><dd id="stat-shards">—</dd>
    <dt>Rigid bodies</dt><dd id="stat-bodies">—</dd>
    <dt>Tiles destroyed</dt><dd id="stat-tiles">—</dd>
  </dl>

  <p class="controls">
    Click to capture the mouse.<br />
    <b>WASD</b> move, <b>Space</b> / <b>C</b> rise and drop, <b>Shift</b> to sprint.<br />
    <b>Left click</b> fires the rifle, <b>right click</b> the breaching charge.
  </p>

  <div id="boot">
    <h1 id="boot-title">Starting up</h1>
    <p id="boot-stage">Loading modules.</p>
    <pre id="boot-detail" hidden></pre>
  </div>

  <script id="entry" type="module" src="./src/main.js"></script>

  <!--
    Classic script, NOT a module, and placed after the entry tag on purpose.
    Classic scripts run during parsing while module scripts are deferred, so
    this installs its handlers before any module executes, and #entry already
    exists in the DOM by the time it runs.

    If the module graph fails to resolve at all — a 404 on src/main.js, a
    blocked CDN, file:// — then nothing inside src/ ever runs and the module's
    own error reporting is not there to help. This is the only thing still
    alive in that case.
  -->
  <script>
    (function () {
      var reported = false;

      function report(message, hint) {
        if (reported) return;
        var root = document.getElementById('boot');
        if (!root) return;
        reported = true;
        root.classList.add('is-error');
        document.getElementById('boot-title').textContent = 'Startup failed';
        document.getElementById('boot-stage').textContent =
          hint || 'The page could not load its modules. Details below.';
        var detail = document.getElementById('boot-detail');
        detail.textContent = String(message);
        detail.hidden = false;
      }

      window.addEventListener('error', function (e) {
        if (e.message && /module|import|specifier|fetch/i.test(e.message)) {
          report(e.message + (e.filename ? '\n' + e.filename : ''),
            'A module failed to resolve. Check the Network tab for a failed request.');
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        report(r && r.stack ? r.stack : String(r));
      });

      var entry = document.getElementById('entry');
      if (entry) {
        entry.addEventListener('error', function () {
          report(
            'GET ./src/main.js failed.\n\n' +
            'This page is one file of a multi-file project. It needs the src/ ' +
            'folder served alongside it at the same relative path.\n\n' +
            'If you only have index.html, use the single-file build instead: ' +
            'run  node build.mjs  and open dist/index.html.',
            'The entry module could not be fetched.');
        });
      }

      // The catch-all. If main.js never reaches its first line — which produces
      // a loading screen frozen on its initial static text, with no error event
      // in some browsers — nothing above fires. This does.
      setTimeout(function () {
        if (window.__bootModuleRan || reported) return;
        report(
          'The entry module never executed.\n\n' +
          'Most likely causes:\n' +
          '  1. src/main.js is not being served next to index.html\n' +
          '  2. the page is open over file://, which blocks ES modules\n' +
          '  3. the import map failed to fetch three.module.js\n\n' +
          'Open the browser console — the real message is there. Or use the ' +
          'single-file build: node build.mjs, then open dist/index.html.',
          'Nothing in src/ ever ran.');
      }, 4000);
    })();
  </script>

</body>
</html>
